# System Duo for DeepSeek Harness: System One (decision models) on the agent loop, and System Two, the free LLM
# vllm-sr/auto from vLLM Semantic Router, both at app.vllm-sr.ai with one key fetched on first use. A model chosen in
# the app's settings still wins, and a profile patch can replace either row.
- insert:
    - id: system-one
      name: '@vllm-sr/dsh'

- id: llm-pi-ai
  config:
    providers:
      vllm-sr:
        displayName: System Duo (vLLM Semantic Router)
        apiKeyEnv: VLLM_SR_API_KEY
        api: openai-completions
        baseURL: https://app.vllm-sr.ai/v1
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        timeoutMs: 600000
        models:
          - id: vllm-sr/auto
            name: vllm-sr/auto
            # the router sends a request that carries an image to its vision decision, tool calls and all
            input: [text, image]
            contextWindow: 131072
            maxTokens: 32768

- id: agent-default-model
  config:
    provider: vllm-sr
    model: vllm-sr/auto
